spring.application.name=backend1
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
cors.origens=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
backend2.host=${BACKEND2_HOST:localhost}
backend2.porta=${BACKEND2_PORTA:3000}
cozinha.postos=${COZINHA_POSTOS:3}
# Demo: relógio do simulador, 1 min do cardápio = 10 s, e quanto o pedido pronto fica na tela
demo.intervaloMs=${DEMO_INTERVALO_MS:1000}
demo.segundosPorMinuto=${DEMO_SEGUNDOS_POR_MINUTO:10}
demo.toleranciaProntoSeg=${DEMO_TOLERANCIA_PRONTO_SEG:15}
